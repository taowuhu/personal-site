<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg2)"/>
  <!-- Magazine grid layout -->
  <g opacity="0.04">
    <rect x="0" y="0" width="400" height="600" fill="#fff"/>
  </g>
  <!-- Large feature image placeholder with abstract shapes -->
  <rect x="0" y="0" width="450" height="600" fill="#1a1a1a"/>
  <circle cx="225" cy="200" r="80" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <circle cx="225" cy="200" r="120" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
  <circle cx="225" cy="200" r="160" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="0.5"/>
  <circle cx="225" cy="380" r="60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <rect x="125" y="320" width="200" height="200" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.5" transform="rotate(15, 225, 420)"/>
  <!-- Magazine text layout right side -->
  <text x="490" y="100" fill="#f1f1f1" font-family="serif" font-size="14" font-weight="bold" letter-spacing="3">MONOLITH</text>
  <text x="490" y="120" fill="rgba(255,255,255,0.2)" font-family="sans-serif" font-size="8" letter-spacing="2">ISSUE NO. 06 — 2026</text>
  <line x1="490" y1="140" x2="750" y2="140" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <!-- Article title -->
  <text x="490" y="200" fill="#f1f1f1" font-family="serif" font-size="32" font-weight="bold">
    <tspan x="490" dy="0">The Future of</tspan>
    <tspan x="490" dy="36">Minimalism</tspan>
  </text>
  <line x1="490" y1="290" x2="530" y2="290" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <!-- Body text lines -->
  <rect x="490" y="310" width="260" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
  <rect x="490" y="326" width="240" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
  <rect x="490" y="342" width="260" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
  <rect x="490" y="358" width="200" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
  <rect x="490" y="374" width="250" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
  <rect x="490" y="390" width="230" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
  <rect x="490" y="406" width="260" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
  <rect x="490" y="422" width="180" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
  <!-- Pull quote -->
  <rect x="490" y="460" width="260" height="60" rx="4" fill="rgba(255,255,255,0.03)"/>
  <text x="500" y="485" fill="rgba(255,255,255,0.4)" font-family="serif" font-size="13" font-style="italic">"Simplicity is the</text>
  <text x="500" y="503" fill="rgba(255,255,255,0.4)" font-family="serif" font-size="13" font-style="italic">ultimate sophistication"</text>
  <!-- Page number -->
  <text x="750" y="570" fill="rgba(255,255,255,0.15)" font-family="sans-serif" font-size="10" text-anchor="end">24 — 67</text>
</svg>
