<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <radialGradient id="sunSet">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#e94560" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="glowOrange">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg4)"/>
  <!-- Sunset gradient circle -->
  <circle cx="400" cy="350" r="250" fill="url(#sunSet)"/>
  <!-- Stage/festival layout -->
  <!-- Stage frame -->
  <rect x="100" y="80" width="600" height="360" rx="4" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <!-- Sun/moon circle -->
  <circle cx="400" cy="220" r="70" fill="none" stroke="#f5a623" stroke-width="1" opacity="0.4" filter="url(#glowOrange)"/>
  <circle cx="400" cy="220" r="68" fill="rgba(245,166,35,0.06)"/>
  <!-- Light rays -->
  <g opacity="0.06" stroke="#f5a623" stroke-width="1">
    <line x1="400" y1="220" x2="400" y2="80"/>
    <line x1="400" y1="220" x2="530" y2="150"/>
    <line x1="400" y1="220" x2="270" y2="150"/>
    <line x1="400" y1="220" x2="550" y2="300"/>
    <line x1="400" y1="220" x2="250" y2="300"/>
  </g>
  <!-- Crowd dots -->
  <g fill="#fff" opacity="0.04">
    <circle cx="150" cy="400" r="2"/><circle cx="180" cy="420" r="2"/>
    <circle cx="200" cy="390" r="2"/><circle cx="230" cy="410" r="2"/>
    <circle cx="260" cy="430" r="2"/><circle cx="280" cy="400" r="2"/>
    <circle cx="310" cy="420" r="2"/><circle cx="340" cy="390" r="2"/>
    <circle cx="360" cy="410" r="2"/><circle cx="390" cy="430" r="2"/>
    <circle cx="420" cy="400" r="2"/><circle cx="450" cy="420" r="2"/>
    <circle cx="480" cy="390" r="2"/><circle cx="510" cy="410" r="2"/>
    <circle cx="540" cy="430" r="2"/><circle cx="570" cy="400" r="2"/>
    <circle cx="600" cy="420" r="2"/><circle cx="630" cy="390" r="2"/>
    <circle cx="650" cy="410" r="2"/>
  </g>
  <!-- Festival title text -->
  <text x="400" y="130" fill="#f1f1f1" font-family="sans-serif" font-size="36" font-weight="600" text-anchor="middle" letter-spacing="8">SOLSTICE</text>
  <text x="400" y="155" fill="rgba(245,166,35,0.5)" font-family="sans-serif" font-size="12" text-anchor="middle" letter-spacing="6">MUSIC & ARTS FESTIVAL</text>
  <!-- Date info -->
  <text x="400" y="330" fill="rgba(255,255,255,0.2)" font-family="sans-serif" font-size="11" text-anchor="middle" letter-spacing="4">21 — 23 JUNE 2026</text>
  <text x="400" y="350" fill="rgba(255,255,255,0.12)" font-family="sans-serif" font-size="10" text-anchor="middle" letter-spacing="3">SILICON VALLEY, CA</text>
  <!-- Bottom info bar -->
  <rect x="200" y="470" width="400" height="50" rx="25" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <text x="400" y="498" fill="rgba(255,255,255,0.3)" font-family="sans-serif" font-size="10" text-anchor="middle" letter-spacing="4">TICKETS ON SALE NOW</text>
  <!-- Decorative lines -->
  <line x1="230" y1="475" x2="200" y2="475" stroke="rgba(245,166,35,0.3)" stroke-width="1"/>
  <line x1="570" y1="475" x2="600" y2="475" stroke="rgba(245,166,35,0.3)" stroke-width="1"/>
  <!-- Mini card at bottom -->
  <rect x="340" y="540" width="120" height="20" rx="10" fill="rgba(245,166,35,0.1)"/>
  <text x="400" y="554" fill="#f5a623" font-family="sans-serif" font-size="9" text-anchor="middle" letter-spacing="2">LINEUP →</text>
</svg>
