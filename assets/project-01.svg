<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg1)"/>
  <!-- Dashboard grid lines -->
  <g opacity="0.06" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
  </g>
  <!-- Top bar -->
  <rect x="30" y="30" width="740" height="40" rx="6" fill="rgba(255,255,255,0.05)"/>
  <circle cx="55" cy="50" r="5" fill="#e94560"/>
  <circle cx="72" cy="50" r="5" fill="#f5a623"/>
  <circle cx="89" cy="50" r="5" fill="#2ed573"/>
  <!-- Sidebar -->
  <rect x="30" y="85" width="160" height="485" rx="8" fill="rgba(255,255,255,0.03)"/>
  <rect x="50" y="110" width="120" height="12" rx="6" fill="rgba(255,255,255,0.08)"/>
  <rect x="50" y="140" width="120" height="12" rx="6" fill="rgba(233,69,96,0.3)"/>
  <rect x="50" y="170" width="100" height="12" rx="6" fill="rgba(255,255,255,0.06)"/>
  <rect x="50" y="200" width="100" height="12" rx="6" fill="rgba(255,255,255,0.06)"/>
  <!-- Main chart area -->
  <rect x="210" y="85" width="320" height="240" rx="10" fill="rgba(255,255,255,0.03)"/>
  <text x="225" y="115" fill="rgba(255,255,255,0.3)" font-family="sans-serif" font-size="11" letter-spacing="2">REVENUE TREND</text>
  <!-- Chart line -->
  <polyline points="230,280 280,250 330,260 380,200 430,220 480,160 510,140" fill="none" stroke="#e94560" stroke-width="2" opacity="0.7"/>
  <polyline points="230,280 280,250 330,260 380,200 430,220 480,160 510,140" fill="url(#glow1)" opacity="0.08"/>
  <!-- Chart dots -->
  <circle cx="230" cy="280" r="3" fill="#e94560" opacity="0.8"/>
  <circle cx="280" cy="250" r="3" fill="#e94560" opacity="0.8"/>
  <circle cx="330" cy="260" r="3" fill="#e94560" opacity="0.8"/>
  <circle cx="380" cy="200" r="3" fill="#e94560" opacity="0.8"/>
  <circle cx="430" cy="220" r="3" fill="#e94560" opacity="0.8"/>
  <circle cx="480" cy="160" r="3" fill="#e94560" opacity="0.8"/>
  <circle cx="510" cy="140" r="3" fill="#e94560" opacity="0.8"/>
  <!-- Second chart area -->
  <rect x="210" y="340" width="320" height="230" rx="10" fill="rgba(255,255,255,0.03)"/>
  <text x="225" y="370" fill="rgba(255,255,255,0.3)" font-family="sans-serif" font-size="11" letter-spacing="2">USER GROWTH</text>
  <!-- Bar chart -->
  <rect x="235" y="490" width="22" height="60" rx="2" fill="#e94560" opacity="0.6"/>
  <rect x="265" y="470" width="22" height="80" rx="2" fill="#e94560" opacity="0.7"/>
  <rect x="295" y="440" width="22" height="110" rx="2" fill="#e94560" opacity="0.8"/>
  <rect x="325" y="430" width="22" height="120" rx="2" fill="#e94560" opacity="0.9"/>
  <rect x="355" y="410" width="22" height="140" rx="2" fill="#e94560"/>
  <rect x="385" y="400" width="22" height="150" rx="2" fill="#e94560"/>
  <rect x="415" y="380" width="22" height="170" rx="2" fill="#e94560"/>
  <rect x="445" y="370" width="22" height="180" rx="2" fill="#e94560"/>
  <rect x="475" y="360" width="22" height="190" rx="2" fill="#e94560"/>
  <!-- Right stats panels -->
  <rect x="550" y="85" width="220" height="110" rx="10" fill="rgba(255,255,255,0.03)"/>
  <text x="570" y="115" fill="rgba(255,255,255,0.3)" font-family="sans-serif" font-size="11" letter-spacing="2">TOTAL REVENUE</text>
  <text x="570" y="150" fill="#f1f1f1" font-family="sans-serif" font-size="28" font-weight="bold">$1.28M</text>
  <text x="570" y="175" fill="#2ed573" font-family="sans-serif" font-size="12">+12.5% ↑</text>
  <rect x="550" y="215" width="220" height="110" rx="10" fill="rgba(255,255,255,0.03)"/>
  <text x="570" y="245" fill="rgba(255,255,255,0.3)" font-family="sans-serif" font-size="11" letter-spacing="2">ACTIVE USERS</text>
  <text x="570" y="280" fill="#f1f1f1" font-family="sans-serif" font-size="28" font-weight="bold">24.6K</text>
  <text x="570" y="305" fill="#2ed573" font-family="sans-serif" font-size="12">+8.3% ↑</text>
  <rect x="550" y="340" width="220" height="110" rx="10" fill="rgba(255,255,255,0.03)"/>
  <text x="570" y="370" fill="rgba(255,255,255,0.3)" font-family="sans-serif" font-size="11" letter-spacing="2">CONVERSION RATE</text>
  <text x="570" y="405" fill="#f1f1f1" font-family="sans-serif" font-size="28" font-weight="bold">3.42%</text>
  <text x="570" y="430" fill="#f5a623" font-family="sans-serif" font-size="12">+0.8% ↑</text>
  <rect x="550" y="465" width="220" height="105" rx="10" fill="rgba(255,255,255,0.03)"/>
  <text x="570" y="495" fill="rgba(255,255,255,0.3)" font-family="sans-serif" font-size="11" letter-spacing="2">AVG SESSION</text>
  <text x="570" y="530" fill="#f1f1f1" font-family="sans-serif" font-size="28" font-weight="bold">4m 32s</text>
  <text x="570" y="555" fill="#2ed573" font-family="sans-serif" font-size="12">+2.1% ↑</text>
</svg>
