<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片格式转换 · 墨煜工具箱</title>
<meta name="description" content="免费在线批量图片格式转换，支持 WebP/PNG，浏览器本地处理，隐私安全。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07070a;--surface:rgba(18,18,28,0.5);--surface2:rgba(18,18,28,0.7);--border:rgba(255,255,255,0.04);--border2:rgba(255,255,255,0.06);
  --text:#eaeaef;--text2:#888896;--text3:#555566;
  --p:#b388ff;--pi:#818cf8;--b:#38bdf8;--g:#4ade80;--y:#f59e0b;--r:#ef4444;
  --grad:linear-gradient(135deg,#b388ff,#818cf8,#38bdf8);
  --grad2:linear-gradient(135deg,#b388ff 0%,#38bdf8 100%);
  --rad:14px;--rs:8px;--max:1100px;
}
body{font-family:'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.6}
::selection{background:rgba(179,136,255,0.2)}
#three-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.container{max-width:var(--max);margin:0 auto;padding:0 24px;position:relative;z-index:2}

/* Nav */
nav{position:fixed;top:0;left:0;right:0;height:60px;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:0 28px;background:rgba(7,7,10,0.4);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid transparent}
nav .logo{font-size:16px;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
nav .links{display:flex;gap:1px;list-style:none}
nav .links a{text-decoration:none;color:var(--text3);font-size:12px;font-weight:500;padding:5px 12px;border-radius:6px;transition:all 0.25s}
nav .links a:hover{color:var(--text);background:rgba(255,255,255,0.03)}

/* Header */
header{padding:100px 0 40px;text-align:center;position:relative;z-index:2}
header .badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--g);margin-bottom:16px;padding:4px 12px;border-radius:100px;background:rgba(74,222,128,0.06);border:1px solid rgba(74,222,128,0.08)}
header .badge .dot{width:5px;height:5px;border-radius:50%;background:var(--g);box-shadow:0 0 8px rgba(74,222,128,0.3);animation:pd 2s infinite}
@keyframes pd{0%,100%{opacity:1}50%{opacity:0.3}}
header h1{font-size:clamp(28px,4vw,40px);font-weight:700;letter-spacing:-0.03em;margin-bottom:8px}
header h1 span{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header .sub{font-size:13px;color:var(--text2)}

/* Upload zone */
.upload-section{padding:0 0 40px;position:relative;z-index:2}
.drop-zone{border:2px dashed var(--border2);border-radius:var(--rad);padding:48px 24px;text-align:center;cursor:pointer;transition:all 0.3s;background:var(--surface)}
.drop-zone:hover{border-color:rgba(179,136,255,0.15);background:rgba(179,136,255,0.02)}
.drop-zone.drag-active{border-color:var(--g);background:rgba(74,222,128,0.04);animation:pulse-border 1.5s ease-in-out infinite}
@keyframes pulse-border{0%,100%{border-color:#22c55e}50%{border-color:#4ade80}}
.drop-zone .dz-icon{font-size:48px;margin-bottom:12px;opacity:0.6}
.drop-zone h3{font-size:15px;font-weight:600;margin-bottom:4px}
.drop-zone p{font-size:12px;color:var(--text3);margin-bottom:16px}
.drop-zone .dz-btns{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 20px;border-radius:var(--rs);font-size:12px;font-weight:500;text-decoration:none;border:none;cursor:pointer;transition:all 0.25s;font-family:inherit}
.btn-primary{background:var(--grad2);color:#fff;box-shadow:0 2px 16px rgba(179,136,255,0.15)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(179,136,255,0.25)}
.btn-secondary{background:var(--surface);border:1px solid var(--border2);color:var(--text2)}
.btn-secondary:hover{border-color:rgba(179,136,255,0.1);color:var(--text)}
.btn-danger{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.15);color:var(--r)}
.btn-danger:hover{background:rgba(239,68,68,0.12)}
.btn:disabled{opacity:0.4;cursor:not-allowed;transform:none!important}
.btn-sm{padding:6px 14px;font-size:10px}

/* Settings panel */
.settings-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--rad);padding:24px;margin-bottom:24px;position:relative;z-index:2}
.settings-panel h3{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text3);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.format-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:320px;margin-bottom:20px}
.fmt-btn{padding:14px 16px;border-radius:var(--rs);border:2px solid transparent;background:var(--surface);text-align:left;cursor:pointer;transition:all 0.25s;font-family:inherit;color:var(--text)}
.fmt-btn:hover{border-color:var(--border2)}
.fmt-btn.active{border-color:var(--p);background:rgba(179,136,255,0.04)}
.fmt-btn .f-icon{font-size:22px;margin-bottom:4px}
.fmt-btn .f-name{font-size:13px;font-weight:600}
.fmt-btn .f-hint{font-size:10px;color:var(--text3)}

.size-opt{background:rgba(56,189,248,0.03);border:1px solid rgba(56,189,248,0.08);border-radius:var(--rs);padding:16px;margin-bottom:16px}
.size-opt label{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:var(--text2)}
.size-opt input[type=checkbox]{accent-color:var(--b)}
.size-opt input[type=number]{width:64px;padding:4px 8px;border-radius:4px;border:1px solid var(--border2);background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:12px;text-align:center}

.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode-btn{padding:16px;border-radius:var(--rs);border:2px solid transparent;background:var(--surface);text-align:left;cursor:pointer;transition:all 0.25s;font-family:inherit;color:var(--text)}
.mode-btn:hover{border-color:var(--border2)}
.mode-btn.active{border-color:var(--p);background:rgba(179,136,255,0.04)}
.mode-btn .m-name{font-size:13px;font-weight:600;margin-bottom:2px}
.mode-btn .m-hint{font-size:10px;color:var(--text3)}

.quality-slider{margin-top:16px;padding:16px;background:rgba(179,136,255,0.02);border-radius:var(--rs);border:1px solid var(--border)}
.quality-slider input[type=range]{width:100%;accent-color:var(--p)}

/* Stats bar */
.stats-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding:14px 20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);margin-bottom:24px;position:relative;z-index:2}
.stats-bar .stat{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:4px}
.stats-bar .stat strong{color:var(--text);font-weight:600}
.stats-bar .badge{font-size:10px;padding:3px 10px;border-radius:100px;font-weight:600}
.stats-bar .badge.out{background:rgba(179,136,255,0.06);color:var(--p)}
.stats-bar .badge.size{background:rgba(56,189,248,0.06);color:var(--b)}

/* Folder cards */
.folder-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rad);padding:20px;margin-bottom:12px;transition:all 0.3s;position:relative;z-index:2}
.folder-card:hover{border-color:var(--border2)}
.folder-card .f-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.folder-card .f-title{display:flex;align-items:center;gap:8px}
.folder-card .f-title .f-icon{font-size:20px}
.folder-card .f-title h4{font-size:13px;font-weight:600}
.folder-card .f-title .f-count{font-size:10px;color:var(--text3)}
.folder-card .f-close{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.03);border:none;color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all 0.2s}
.folder-card .f-close:hover{background:rgba(239,68,68,0.1);color:var(--r)}

/* Progress bar */
.progress-bar{height:3px;background:var(--border);border-radius:2px;margin-bottom:14px;overflow:hidden}
.progress-bar .fill{height:100%;border-radius:2px;transition:width 0.3s}
.progress-bar .fill.done{background:var(--g)}
.progress-bar .fill.active{background:var(--grad2);animation:stripe 1s linear infinite;background-image:linear-gradient(45deg,rgba(255,255,255,0.15) 25%,transparent 25%,transparent 50%,rgba(255,255,255,0.15) 50%,rgba(255,255,255,0.15) 75%,transparent 75%,transparent);background-size:1rem 1rem}
@keyframes stripe{from{background-position:1rem 0}to{background-position:0 0}}

/* Thumbnail grid */
.thumb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;margin-bottom:12px;max-height:160px;overflow-y:auto}
.thumb-grid .thumb{aspect-ratio:1;border-radius:6px;overflow:hidden;background:var(--bg);position:relative;cursor:pointer}
.thumb-grid .thumb img{width:100%;height:100%;object-fit:cover}
.thumb-grid .thumb .fmt-tag{position:absolute;top:0;left:0;font-size:8px;padding:1px 5px;background:rgba(0,0,0,0.6);color:var(--text);border-radius:0 0 4px 0}
.thumb-grid .thumb .size-tag{position:absolute;top:0;right:0;font-size:8px;padding:1px 4px;border-radius:0 0 0 4px}
.thumb-grid .thumb .size-tag.ok{background:rgba(74,222,128,0.6);color:#fff}
.thumb-grid .thumb .size-tag.warn{background:rgba(245,158,11,0.6);color:#fff}
.thumb-grid .thumb.pending{display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:20px}

/* Footer */
footer{padding:40px 0;text-align:center;position:relative;z-index:2;border-top:1px solid var(--border)}
footer p{font-size:10px;color:var(--text3)}
footer a{color:var(--text2);text-decoration:none}

/* Custom cursor */
.cursor-glow{position:fixed;inset:0;pointer-events:none;z-index:9999}
.cursor-dot{position:absolute;width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(179,136,255,0.6);background:transparent;box-shadow:0 0 14px rgba(179,136,255,0.3),0 0 32px rgba(179,136,255,0.1),inset 0 0 6px rgba(179,136,255,0.1);transform:translate(-50%,-50%)}
.cursor-trail{position:absolute;width:6px;height:6px;border-radius:50%;border:1px solid rgba(179,136,255,0.25);background:transparent;transform:translate(-50%,-50%);animation:trailFade 0.7s ease-out forwards}
@keyframes trailFade{0%{opacity:0.5;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(0.2)}}
body{cursor:none}
a,button,.btn,.thumb,.drop-zone{cursor:none}

/* Modal */
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.75);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.3s}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rad);padding:24px;max-width:700px;width:92vw;max-height:85vh;overflow-y:auto;position:relative}
.modal-box .m-close{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.04);border:none;color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-box .m-close:hover{background:rgba(255,255,255,0.06);color:var(--text)}
.modal-box .m-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.modal-box .m-title{font-size:14px;font-weight:600}
.modal-box .m-compare{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.modal-box .m-compare img{width:100%;border-radius:8px;background:rgba(0,0,0,0.3)}
.modal-box .m-compare .m-label{font-size:10px;color:var(--text3);margin-bottom:4px}

@media(max-width:640px){
  .format-grid{grid-template-columns:1fr}
  .mode-grid{grid-template-columns:1fr}
  .modal-box .m-compare{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="three-canvas"></div>
<div class="cursor-glow" id="cursorGlow"></div>

<nav>
  <div class="logo">墨煜</div>
  <ul class="links">
    <li><a href="index.html">← 返回主页</a></li>

<div class="container">
  <input type="file" id="fileInput" accept=".png,.jpg,.jpeg,.gif,.bmp,.tiff,.tif,.webp,image/png,image/jpeg,image/gif,image/bmp,image/tiff,image/webp" multiple style="display:none">

        <span style="font-size:14px;font-weight:700;color:var(--p)" id="qualityValue">80%</span>

  <div id="folderContainer"></div>

<footer>

<div class="modal-overlay" id="modalOverlay">

      <div><div class="m-label">原图</div><img id="modalOriginal"></div>
      <div><div class="m-label">转换后</div><img id="modalOutput"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
// ===== Three.js particles =====
(function(){
  if(typeof THREE==='undefined'){setTimeout(arguments.callee,100);return}
  const c=document.getElementById('three-canvas');
  const s=new THREE.Scene();s.fog=new THREE.FogExp2(0x07070a,0.0005);
  const cam=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);cam.position.z=60;
  const r=new THREE.WebGLRenderer({alpha:true,antialias:true});
  r.setSize(window.innerWidth,window.innerHeight);r.setPixelRatio(Math.min(window.devicePixelRatio,2));
  c.appendChild(r.domElement);
  const g=new THREE.BufferGeometry();
  const n=800;const p=new Float32Array(n*3);
  for(let i=0;i<n*3;i+=3){p[i]=(Math.random()-0.5)*100;p[i+1]=(Math.random()-0.5)*60;p[i+2]=(Math.random()-0.5)*80}
  g.setAttribute('position',new THREE.BufferAttribute(p,3));
  const m=new THREE.PointsMaterial({color:0xb388ff,size:0.08,transparent:true,opacity:0.5,blending:THREE.AdditiveBlending,depthWrite:false});
  const pts=new THREE.Points(g,m);s.add(pts);
  function anim(){requestAnimationFrame(anim);pts.rotation.y+=0.0003;pts.rotation.x+=0.0001;r.render(s,cam)}
  anim();
  window.addEventListener('resize',()=>{cam.aspect=window.innerWidth/window.innerHeight;cam.updateProjectionMatrix();r.setSize(window.innerWidth,window.innerHeight)});
})();

// ===== Custom cursor =====
const glow=document.getElementById('cursorGlow');
let mx=0,my=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;
  const d=document.createElement('div');d.className='cursor-trail';d.style.left=e.clientX+'px';d.style.top=e.clientY+'px';glow.appendChild(d);
  setTimeout(()=>d.remove(),700);
});
(function update(){const dot=glow.querySelector('.cursor-dot');if(!dot){const d=document.createElement('div');d.className='cursor-dot';glow.appendChild(d)}const cd=glow.querySelector('.cursor-dot');cd.style.left=mx+'px';cd.style.top=my+'px';requestAnimationFrame(update)})();

// ===== File Converter Logic =====
const SUPPORTED_FORMATS={'image/png':'PNG','image/jpeg':'JPG','image/gif':'GIF','image/bmp':'BMP','image/tiff':'TIFF','image/webp':'WebP'};

let folders=[],outputFormat='webp',sizeLimitEnabled=true,sizeLimitKB=500,mode='lossless',quality=80,isConverting=false,folderIdCounter=0;

const dropZone=document.getElementById('dropZone'),fileInput=document.getElementById('fileInput'),folderInput=document.getElementById('folderInput');
const settingsPanel=document.getElementById('settingsPanel'),statsBar=document.getElementById('statsBar'),folderContainer=document.getElementById('folderContainer');

document.getElementById('selectFileBtn').addEventListener('click',()=>fileInput.click());
document.getElementById('selectFolderBtn').addEventListener('click',()=>folderInput.click());
fileInput.addEventListener('change',e=>handleFiles(e.target.files,'未分组文件'));
folderInput.addEventListener('change',e=>{const fs=e.target.files;if(fs.length>0)handleFiles(fs,fs[0].webkitRelativePath.split('/')[0])});

dropZone.addEventListener('click',e=>{if(!e.target.closest('button'))fileInput.click()});
dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('drag-active')});
dropZone.addEventListener('dragleave',e=>{e.preventDefault();dropZone.classList.remove('drag-active')});
dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('drag-active');handleFiles(e.dataTransfer.files,'拖拽上传')});

// Settings
document.getElementById('sizeLimitEnabled').addEventListener('change',e=>{sizeLimitEnabled=e.target.checked;updateUI()});
document.getElementById('sizeLimitKB').addEventListener('change',e=>{sizeLimitKB=parseInt(e.target.value)||500;updateUI()});
document.getElementById('qualityInput').addEventListener('input',e=>{quality=parseInt(e.target.value);document.getElementById('qualityValue').textContent=quality+'%';updateUI()});

document.querySelectorAll('.fmt-btn').forEach(b=>b.addEventListener('click',()=>{
  outputFormat=b.dataset.format;
  document.querySelectorAll('.fmt-btn').forEach(x=>x.classList.toggle('active',x===b));
  document.getElementById('webpOptions').style.display=outputFormat==='webp'?'block':'none';
  document.getElementById('outputBadge').textContent=outputFormat.toUpperCase();
  updateModeUI();
  updateUI();
}));

document.querySelectorAll('.mode-btn').forEach(b=>b.addEventListener('click',()=>{
  mode=b.dataset.mode;
  document.querySelectorAll('.mode-btn').forEach(x=>x.classList.toggle('active',x===b));
  document.getElementById('qualitySlider').style.display=(outputFormat==='webp'&&!sizeLimitEnabled&&mode==='custom')?'block':'none';
  updateUI();
}));
function updateModeUI(){
  document.getElementById('qualitySlider').style.display=(outputFormat==='webp'&&!sizeLimitEnabled&&mode==='custom')?'block':'none';
}

function isImage(file){const ext=file.name.toLowerCase().split('.').pop();return SUPPORTED_FORMATS[file.type]||['png','jpg','jpeg','gif','bmp','tiff','tif','webp'].includes(ext)}
function fmtLabel(file){return SUPPORTED_FORMATS[file.type]||file.name.split('.').pop().toUpperCase()}
function fmtSize(b){if(b===0)return'0 B';const k=1024,i=Math.floor(Math.log(b)/Math.log(k));return parseFloat((b/Math.pow(k,i)).toFixed(1))+' '+['B','KB','MB'][i]}

function handleFiles(fileList,folderName){
  const files=Array.from(fileList).filter(isImage);
  if(!files.length)return;
  let folder=folders.find(f=>f.name===folderName);
  if(!folder){folder={id:folderIdCounter++,name:folderName,files:[],converting:false};folders.push(folder)}
  files.forEach(file=>{if(!folder.files.find(f=>f.file.name===file.name&&f.file.size===file.size))folder.files.push({file,status:'pending',outputBlob:null,outputUrl:null,outputSize:0})});
  updateUI();
}

function getQuality(){
  if(outputFormat==='png')return null;
  if(mode==='lossless')return 1;
  if(mode==='high')return 0.95;
  return quality/100;
}

function convertItem(item){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const reader=new FileReader();
    reader.onload=e=>{img.onload=()=>{
      const canvas=document.createElement('canvas');canvas.width=img.width;canvas.height=img.height;
      canvas.getContext('2d').drawImage(img,0,0);
      const ext=outputFormat==='png'?'.png':'.webp';
      const mime=outputFormat==='png'?'image/png':'image/webp';
      const q=outputFormat==='png'?null:getQuality();
      canvas.toBlob(blob=>{if(blob)resolve({blob,url:URL.createObjectURL(blob),size:blob.size,filename:item.file.name.replace(/\.[^.]+$/,ext)});else reject(new Error('fail'))},mime,q);
    };img.src=e.target.result};
    reader.onerror=()=>reject(new Error('read error'));
    reader.readAsDataURL(item.file);
  });
}

async function smartConvert(item){
  const target=sizeLimitKB*1024;
  let result=await convertItem(item);
  if(result.size<=target)return result;
  let lo=0.3,hi=getQuality(),best=result;
  while(hi-lo>0.05){const mid=(lo+hi)/2;result=await convertItem_p(item,mid);if(result.size<=target){best=result;lo=mid}else{hi=mid}}
  return best;
}
function convertItem_p(item,q){return new Promise((resolve,reject)=>{
  const img=new Image();const reader=new FileReader();
  reader.onload=e=>{img.onload=()=>{const c=document.createElement('canvas');c.width=img.width;c.height=img.height;c.getContext('2d').drawImage(img,0,0);c.toBlob(b=>{if(b)resolve({blob:b,url:URL.createObjectURL(b),size:b.size,filename:item.file.name.replace(/\.[^.]+$/,'.webp')});else reject(new Error('fail'))},'image/webp',q)};img.src=e.target.result};reader.readAsDataURL(item.file);
})}

async function convertFolder(folder){
  if(folder.converting)return;folder.converting=true;updateUI();
  for(const item of folder.files){
    if(item.status==='done')continue;
    item.status='converting';updateUI();
    try{
      const result=sizeLimitEnabled&&outputFormat==='webp'?await smartConvert(item):await convertItem(item);
      item.outputBlob=result.blob;item.outputUrl=result.url;item.outputSize=result.size;item.outputFilename=result.filename;item.status='done';
    }catch(e){item.status='error'}
  }
  folder.converting=false;updateUI();
}

function removeFolder(id){const f=folders.find(x=>x.id===id);if(!f)return;f.files.forEach(x=>{if(x.outputUrl)URL.revokeObjectURL(x.outputUrl)});folders=folders.filter(x=>x.id!==id);updateUI()}
function clearAll(){folders.forEach(f=>f.files.forEach(x=>{if(x.outputUrl)URL.revokeObjectURL(x.outputUrl)}));folders=[];updateUI()}

function downloadAll(){
  folders.forEach(f=>{const done=f.files.filter(x=>x.status==='done');
    if(done.length<=5){done.forEach(x=>{const a=document.createElement('a');a.href=URL.createObjectURL(x.outputBlob);a.download=x.outputFilename;a.click()})}
    else{const zip=new JSZip();done.forEach(x=>zip.file(x.outputFilename,x.outputBlob));zip.generateAsync({type:'blob'}).then(c=>{const a=document.createElement('a');a.href=URL.createObjectURL(c);a.download=f.name+'_'+outputFormat+'.zip';a.click()})}
  })
}

// Modal
let previewItem=null;
const modalOverlay=document.getElementById('modalOverlay');
document.getElementById('modalClose').addEventListener('click',()=>modalOverlay.classList.remove('open'));
modalOverlay.addEventListener('click',e=>{if(e.target===modalOverlay)modalOverlay.classList.remove('open')});
document.getElementById('modalDownload').addEventListener('click',()=>{if(previewItem&&previewItem.outputBlob){const a=document.createElement('a');a.href=URL.createObjectURL(previewItem.outputBlob);a.download=previewItem.outputFilename;a.click()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')modalOverlay.classList.remove('open')});

function preview(item){
  previewItem=item;
  document.getElementById('modalTitle').textContent=item.file.name;
  document.getElementById('modalFormat').textContent=outputFormat.toUpperCase();
  document.getElementById('modalOriginal').src=URL.createObjectURL(item.file);
  document.getElementById('modalOutput').src=item.outputUrl||URL.createObjectURL(item.file);
  modalOverlay.classList.add('open');
}

function updateUI(){
  const hasFiles=folders.length>0;
  settingsPanel.style.display=hasFiles?'block':'none';
  statsBar.style.display=hasFiles?'flex':'none';
  if(!hasFiles){folderContainer.innerHTML='';return}
  let totalFiles=0,totalDone=0;
  folders.forEach(f=>{totalFiles+=f.files.length;totalDone+=f.files.filter(x=>x.status==='done').length});
  document.getElementById('totalFolders').textContent=folders.length;
  document.getElementById('totalFiles').textContent=totalFiles;
  document.getElementById('sizeBadge').textContent='≤'+sizeLimitKB+'KB';
  document.getElementById('sizeBadge').style.display=(outputFormat==='webp'&&sizeLimitEnabled)?'inline':'none';
  document.getElementById('downloadAllBtn').disabled=totalDone===0;

  folderContainer.innerHTML=folders.map(f=>{
    const done=f.files.filter(x=>x.status==='done').length;
    const pct=f.files.length>0?(done/f.files.length*100):0;
    const allDone=done===f.files.length;
    return`<div class="folder-card">
      <div class="f-header">
        <div class="f-title"><span class="f-icon">📁</span><h4>${f.name}</h4><span class="f-count">${f.files.length} 文件</span></div>
        <button class="f-close" onclick="removeFolder(${f.id})">✕</button>
      </div>
      <div class="progress-bar"><div class="fill ${allDone?'done':'active'}" style="width:${pct}%"></div></div>
      <div class="thumb-grid">${f.files.map((item,i)=>{
        const fmt=fmtLabel(item.file);
        if(item.status==='done')return`<div class="thumb" onclick="preview(folders[${folders.indexOf(f)}].files[${i}])"><img src="${item.outputUrl}"><span class="fmt-tag">${fmt}</span>${outputFormat==='webp'&&sizeLimitEnabled?`<span class="size-tag ${item.outputSize<=sizeLimitKB*1024?'ok':'warn'}">${item.outputSize<=sizeLimitKB*1024?'✓':'!'}</span>`:''}</div>`;
        if(item.status==='converting')return`<div class="thumb pending">⏳</div>`;
        return`<div class="thumb pending">📄</div>`;
      }).join('')}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn btn-primary btn-sm" onclick="convertFolder(folders[${folders.indexOf(f)}])" ${f.converting||allDone?'disabled':''}>${allDone?'✓ 已完成':f.converting?'转换中…':'转换此文件夹'}</button>
        ${done>0?`<button class="btn btn-secondary btn-sm" onclick="downloadFolder(${f.id})" ${!allDone?'disabled':''}>下载 (${done})</button>`:''}
      </div>
    </div>`;
  }).join('');
}

window.downloadFolder=function(id){const f=folders.find(x=>x.id===id);if(!f)return;const done=f.files.filter(x=>x.status==='done');
  if(done.length<=5){done.forEach(x=>{const a=document.createElement('a');a.href=URL.createObjectURL(x.outputBlob);a.download=x.outputFilename;a.click()})}
  else{const zip=new JSZip();done.forEach(x=>zip.file(x.outputFilename,x.outputBlob));zip.generateAsync({type:'blob'}).then(c=>{const a=document.createElement('a');a.href=URL.createObjectURL(c);a.download=f.name+'_'+outputFormat+'.zip';a.click()})}
};

document.getElementById('convertAllBtn').addEventListener('click',async()=>{for(const f of folders)await convertFolder(f)});
document.getElementById('downloadAllBtn').addEventListener('click',downloadAll);
document.getElementById('clearAllBtn').addEventListener('click',clearAll);

updateModeUI();
updateUI();
</script>
</body>
