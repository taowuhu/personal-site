<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>你适合什么副业？</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #f0f2f5 0%, #e8ecf1 30%, #f5f3f7 60%, #f0f4f8 100%);
    color: #1d1d1f;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    -webkit-font-smoothing: antialiased;
  }
  .container {
    width: 100%;
    max-width: 420px;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border-radius: 28px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.03);
    overflow: hidden;
    position: relative;
    min-height: 580px;
    border: 1px solid rgba(255,255,255,0.6);
  }

  /* ====== COVER PAGE ====== */
  .cover {
    padding: 52px 32px 44px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 560px;
    position: relative;
    overflow: hidden;
  }
  .cover::before {
    content: '';
    position: absolute;
    top: -60px;
    right: -40px;
    width: 180px;
    height: 180px;
    background: radial-gradient(circle, rgba(0,113,227,0.08) 0%, transparent 70%);
    border-radius: 50%;
  }
  .cover::after {
    content: '';
    position: absolute;
    bottom: -30px;
    left: -30px;
    width: 140px;
    height: 140px;
    background: radial-gradient(circle, rgba(124,77,255,0.06) 0%, transparent 70%);
    border-radius: 50%;
  }
  .cover-icon {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, #0071e3, #5e5ce6);
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    margin-bottom: 24px;
    box-shadow: 0 8px 24px rgba(0,113,227,0.25);
    position: relative;
    z-index: 1;
  }
  .cover-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(0,113,227,0.08);
    color: #0071e3;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 20px;
    margin-bottom: 20px;
    position: relative;
    z-index: 1;
  }
  .cover-badge .dot {
    width: 6px; height: 6px;
    background: #0071e3;
    border-radius: 50%;
    animation: pulse-dot 2s infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }
  .cover h1 {
    font-size: 28px;
    font-weight: 700;
    line-height: 1.35;
    margin-bottom: 10px;
    color: #1d1d1f;
    letter-spacing: -0.3px;
    position: relative;
    z-index: 1;
  }
  .cover h1 .hl {
    background: linear-gradient(135deg, #0071e3, #5e5ce6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .cover .subtitle {
    font-size: 14px;
    color: #86868b;
    line-height: 1.6;
    margin-bottom: 32px;
    max-width: 290px;
    position: relative;
    z-index: 1;
  }
  .cover .features {
    display: flex;
    gap: 20px;
    margin-bottom: 28px;
    position: relative;
    z-index: 1;
  }
  .cover .feat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .cover .feat-icon {
    font-size: 22px;
    width: 44px;
    height: 44px;
    background: rgba(0,113,227,0.06);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cover .feat-label {
    font-size: 11px;
    color: #86868b;
    font-weight: 500;
  }
  .cover .stats {
    font-size: 13px;
    color: #aeaeb2;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 6px;
    position: relative;
    z-index: 1;
  }
  .cover .stats .avatars {
    display: flex;
    margin-right: 4px;
  }
  .cover .stats .av {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid #fff;
    background: linear-gradient(135deg, #ddd, #bbb);
    margin-left: -8px;
  }
  .cover .stats .av:first-child { margin-left: 0; }
  .btn-start {
    background: linear-gradient(135deg, #0071e3, #0060c0);
    color: #fff;
    border: none;
    padding: 15px 52px;
    border-radius: 26px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
    width: 100%;
    max-width: 260px;
    box-shadow: 0 6px 20px rgba(0,113,227,0.3);
    position: relative;
    z-index: 1;
    letter-spacing: 0.2px;
  }
  .btn-start:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(0,113,227,0.4);
  }
  .btn-start:active { transform: scale(0.97); }

  /* ====== QUIZ PAGE ====== */
  .quiz { padding: 28px 24px 32px; display: none; }
  .quiz-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .quiz-category {
    font-size: 12px;
    color: #0071e3;
    font-weight: 600;
    background: rgba(0,113,227,0.07);
    padding: 4px 12px;
    border-radius: 12px;
  }
  .quiz-count {
    font-size: 13px;
    color: #86868b;
    font-weight: 500;
  }
  .quiz-count span { color: #1d1d1f; font-weight: 700; }
  .progress-wrap { margin-bottom: 24px; }
  .progress-bar {
    width: 100%;
    height: 6px;
    background: rgba(0,0,0,0.05);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #0071e3, #5e5ce6, #40c8ff);
    background-size: 200% 100%;
    border-radius: 3px;
    transition: width 0.5s cubic-bezier(0.25, 0.1, 0.25, 1);
    width: 0%;
    animation: shimmer 2s infinite;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .question {
    font-size: 21px;
    font-weight: 700;
    line-height: 1.45;
    margin-bottom: 24px;
    color: #1d1d1f;
    letter-spacing: -0.2px;
  }
  .options { display: flex; flex-direction: column; gap: 9px; }
  .option {
    display: flex;
    align-items: center;
    padding: 15px 16px;
    border: 2px solid transparent;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
    font-size: 14.5px;
    line-height: 1.45;
    color: #1d1d1f;
    background: rgba(0,0,0,0.025);
    position: relative;
    overflow: hidden;
  }
  .option::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(0,113,227,0.04), rgba(94,92,230,0.02));
    opacity: 0;
    transition: opacity 0.3s;
  }
  .option:hover::before { opacity: 1; }
  .option:hover { background: rgba(0,113,227,0.04); border-color: rgba(0,113,227,0.2); }
  .option.selected {
    border-color: #0071e3;
    background: linear-gradient(135deg, rgba(0,113,227,0.06), rgba(94,92,230,0.04));
    box-shadow: 0 2px 12px rgba(0,113,227,0.12);
  }
  .option.selected::before { opacity: 1; }
  .option-icon {
    font-size: 20px;
    width: 38px;
    height: 38px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 14px;
    flex-shrink: 0;
    background: #fff;
    transition: all 0.3s;
  }
  .option.selected .option-icon {
    background: linear-gradient(135deg, #0071e3, #5e5ce6);
    box-shadow: 0 4px 12px rgba(0,113,227,0.25);
  }
  .option-letter {
    font-size: 13px;
    font-weight: 700;
    color: #86868b;
    transition: all 0.3s;
  }
  .option.selected .option-letter { color: #fff; }
  .option-text { flex: 1; }
  .option-check {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid #d1d1d6;
    flex-shrink: 0;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .option.selected .option-check {
    border-color: #0071e3;
    background: #0071e3;
  }
  .option.selected .option-check::after {
    content: '✓';
    color: #fff;
    font-size: 12px;
    font-weight: 700;
  }
  .quiz-nav {
    display: flex;
    justify-content: space-between;
    margin-top: 24px;
    gap: 12px;
  }
  .btn-back {
    background: rgba(0,0,0,0.03);
    border: none;
    color: #86868b;
    padding: 12px 22px;
    border-radius: 22px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.2s;
    visibility: hidden;
  }
  .btn-back.visible { visibility: visible; }
  .btn-back:hover { background: rgba(0,0,0,0.06); }
  .btn-next {
    background: linear-gradient(135deg, #0071e3, #0060c0);
    color: #fff;
    border: none;
    padding: 12px 28px;
    border-radius: 22px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
    flex: 1;
    opacity: 0.35;
    pointer-events: none;
    box-shadow: none;
  }
  .btn-next.active {
    opacity: 1;
    pointer-events: auto;
    box-shadow: 0 4px 14px rgba(0,113,227,0.3);
  }
  .btn-next.active:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,113,227,0.4); }
  .btn-next.active:active { transform: scale(0.97); }

  /* ====== RESULT PAGE ====== */
  .result { display: none; text-align: center; background: #fff; }
  .result-hero {
    background: linear-gradient(180deg, rgba(0,113,227,0.06) 0%, rgba(255,255,255,0) 60%);
    padding: 40px 24px 32px;
    text-align: center;
  }
  .result-icon-wrap {
    width: 88px; height: 88px;
    background: linear-gradient(135deg, #0071e3, #5e5ce6);
    border-radius: 24px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    margin-bottom: 18px;
    box-shadow: 0 10px 30px rgba(0,113,227,0.25);
  }
  .result-type-tag {
    display: inline-block;
    background: rgba(0,113,227,0.08);
    color: #0071e3;
    font-size: 12px;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 20px;
    margin-bottom: 10px;
    letter-spacing: 0.5px;
  }
  .result h2 {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 6px;
    line-height: 1.3;
    letter-spacing: -0.3px;
  }
  .result .result-subtitle {
    font-size: 14px;
    color: #86868b;
    line-height: 1.5;
    max-width: 280px;
    margin: 0 auto;
  }

  /* score cards */
  .score-section {
    padding: 0 24px;
    margin-bottom: 8px;
  }
  .score-section h3 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 16px;
    color: #1d1d1f;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .score-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .score-card {
    background: #f8f8fa;
    border-radius: 14px;
    padding: 14px 12px;
    text-align: center;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  .score-card.top {
    background: linear-gradient(135deg, rgba(0,113,227,0.08), rgba(94,92,230,0.04));
    border: 1.5px solid rgba(0,113,227,0.2);
  }
  .score-card .sc-emoji { font-size: 22px; margin-bottom: 6px; }
  .score-card .sc-name {
    font-size: 12px;
    font-weight: 600;
    color: #1d1d1f;
    margin-bottom: 4px;
  }
  .score-card .sc-bar-bg {
    height: 4px;
    background: rgba(0,0,0,0.06);
    border-radius: 2px;
    overflow: hidden;
    margin: 6px 0;
  }
  .score-card .sc-bar {
    height: 100%;
    border-radius: 2px;
    transition: width 1s cubic-bezier(0.25, 0.1, 0.25, 1);
  }
  .score-card .sc-pct {
    font-size: 18px;
    font-weight: 700;
    color: #1d1d1f;
  }

  /* detail */
  .result-detail {
    padding: 0 24px;
    margin-bottom: 24px;
  }
  .detail-card {
    background: #f8f8fa;
    border-radius: 18px;
    padding: 20px;
    text-align: left;
  }
  .detail-card h3 {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 10px;
    margin-top: 18px;
    color: #1d1d1f;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .detail-card h3:first-child { margin-top: 0; }
  .detail-card p {
    font-size: 13.5px;
    color: #515154;
    line-height: 1.65;
    margin-bottom: 6px;
  }
  .detail-card ul {
    padding-left: 18px;
    font-size: 13.5px;
    color: #515154;
    line-height: 1.9;
    list-style: none;
  }
  .detail-card ul li::before {
    content: '•';
    color: #0071e3;
    font-weight: 700;
    margin-right: 8px;
  }

  /* CTA */
  .result-cta {
    padding: 0 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 20px;
  }
  .btn-share {
    background: linear-gradient(135deg, #0071e3, #0060c0);
    color: #fff;
    border: none;
    padding: 14px;
    border-radius: 26px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    transition: all 0.3s;
    box-shadow: 0 6px 20px rgba(0,113,227,0.25);
    letter-spacing: 0.2px;
  }
  .btn-share:hover { transform: translateY(-1px); box-shadow: 0 8px 28px rgba(0,113,227,0.35); }
  .btn-share:active { transform: scale(0.97); }
  .btn-retry {
    background: none;
    border: 1.5px solid #e5e5ea;
    color: #1d1d1f;
    padding: 12px;
    border-radius: 26px;
    font-size: 14px;
    cursor: pointer;
    width: 100%;
    font-weight: 500;
    transition: all 0.2s;
  }
  .btn-retry:hover { background: rgba(0,0,0,0.02); }

  .disclaimer {
    font-size: 11px;
    color: #aeaeb2;
    text-align: center;
    line-height: 1.5;
    padding: 0 24px 28px;
  }

  /* ====== SHARE OVERLAY ====== */
  .share-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 100;
    justify-content: center;
    align-items: center;
    padding: 24px;
  }
  .share-overlay.show { display: flex; }
  .share-card {
    background: #fff;
    border-radius: 24px;
    padding: 36px 28px 28px;
    text-align: center;
    max-width: 340px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    position: relative;
  }
  .share-card .close-btn {
    background: rgba(0,0,0,0.04);
    border: none;
    width: 32px; height: 32px;
    border-radius: 16px;
    font-size: 18px;
    cursor: pointer;
    color: #86868b;
    position: absolute;
    top: 14px;
    right: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .share-card .close-btn:hover { background: rgba(0,0,0,0.08); }
  .share-label {
    font-size: 13px;
    color: #86868b;
    margin-bottom: 12px;
  }
  .share-result-preview {
    background: linear-gradient(135deg, #f8f8fa, #f0f2f5);
    border-radius: 16px;
    padding: 24px;
    margin: 8px 0 16px;
  }
  .share-result-preview .sr-emoji {
    font-size: 40px;
    margin-bottom: 8px;
  }
  .share-result-preview .sr-title {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.4;
  }
  .share-result-preview .sr-sub {
    font-size: 13px;
    color: #86868b;
    margin-top: 4px;
  }
  .share-cta {
    font-size: 13px;
    color: #515154;
    margin-bottom: 4px;
  }
  .share-tip {
    font-size: 11px;
    color: #aeaeb2;
    margin-top: 8px;
  }

  /* animations */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }
  .fade-in { animation: fadeInUp 0.45s cubic-bezier(0.25, 0.1, 0.25, 1) forwards; }
  .quiz-page { animation: fadeIn 0.3s ease; }
  .option-anim {
    opacity: 0;
    animation: fadeInUp 0.4s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
  }
</style>
</head>
<body>
<div class="container" id="app">

  <!-- COVER -->
  <div class="cover" id="coverPage">
    <div class="cover-icon">💼</div>
    <div class="cover-badge"><span class="dot"></span>12题 · 2分钟</div>
    <h1>你适合<br><span class="hl">什么副业</span>？</h1>
    <p class="subtitle">从性格、能力和时间偏好出发，精准匹配你的专属副业方向</p>
    <div class="features">
      <div class="feat"><div class="feat-icon">🧬</div><span class="feat-label">6种基因</span></div>
      <div class="feat"><div class="feat-icon">⚡</div><span class="feat-label">2分钟</span></div>
      <div class="feat"><div class="feat-icon">🎯</div><span class="feat-label">精准匹配</span></div>
    </div>
    <div class="stats">
      <div class="avatars"><div class="av"></div><div class="av"></div><div class="av"></div></div>
      已有 <strong>12,847</strong> 人完成测试
    </div>
    <button class="btn-start" onclick="startQuiz()">开始测试 →</button>
  </div>

  <!-- QUIZ -->
  <div class="quiz" id="quizPage">
    <div class="quiz-meta">
      <span class="quiz-category">副业基因</span>
      <span class="quiz-count"><span id="qNum">1</span> / 12</span>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="quiz-nav">
      <button class="btn-back" id="btnBack" onclick="prevQuestion()">← 上一题</button>
      <button class="btn-next" id="btnNext" onclick="nextQuestion()">下一题 →</button>
    </div>
  </div>

  <!-- RESULT -->
  <div class="result" id="resultPage">
    <div class="result-hero">
      <div class="result-icon-wrap" id="resultEmojiWrap"></div>
      <div class="result-type-tag" id="resultTag"></div>
      <h2 id="resultTitle"></h2>
      <p class="result-subtitle" id="resultSubtitle"></p>
    </div>

    <div class="score-section">
      <h3>📊 你的副业基因图谱</h3>
      <div class="score-grid" id="scoreGrid"></div>
    </div>

    <div class="result-detail">
      <div class="detail-card" id="resultDetail"></div>
    </div>

    <div class="result-cta">
      <button class="btn-share" onclick="showShare()">📤 分享我的结果</button>
      <button class="btn-retry" onclick="retryQuiz()">🔄 重新测试</button>
    </div>
    <p class="disclaimer">* 本测试仅供娱乐参考，不作为职业建议</p>
  </div>

  <!-- SHARE OVERLAY -->
  <div class="share-overlay" id="shareOverlay" onclick="hideShare(event)">
    <div class="share-card" onclick="event.stopPropagation()">
      <button class="close-btn" onclick="hideShare()">✕</button>
      <p class="share-label">我的副业基因是——</p>
      <div class="share-result-preview">
        <div class="sr-emoji" id="shareEmoji"></div>
        <div class="sr-title" id="shareTitle"></div>
        <div class="sr-sub" id="shareSub"></div>
      </div>
      <p class="share-cta">你也来测测？👉</p>
      <p class="share-tip">长按截图分享给朋友</p>
    </div>
  </div>

// ===== STATE =====
let currentQuestion = 0;
let answers = [];
let selectedOption = null;
const totalQuestions = questions.length;

// ===== FUNCTIONS =====
function startQuiz() {
  document.getElementById('coverPage').style.display = 'none';
  document.getElementById('quizPage').style.display = 'block';
  document.getElementById('resultPage').style.display = 'none';
  currentQuestion = 0;
  answers = new Array(totalQuestions).fill(null);
  selectedOption = null;
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQuestion];
  document.getElementById('qNum').textContent = currentQuestion + 1;
  document.getElementById('progressFill').style.width = `${((currentQuestion + 1) / totalQuestions) * 100}%`;
  document.getElementById('questionText').textContent = q.q;

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];
  selectedOption = answers[currentQuestion];

  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option' + (selectedOption === i ? ' selected' : '') + ' option-anim';
    div.style.animationDelay = `${i * 0.06}s`;
    div.innerHTML = `
      <div class="option-icon"><span class="option-letter">${letters[i]}</span></div>
      <span class="option-text">${opt.text}</span>
      <div class="option-check"></div>
    `;
    div.onclick = () => selectOption(i);
    container.appendChild(div);
  });

  const btnBack = document.getElementById('btnBack');
  currentQuestion === 0 ? btnBack.classList.remove('visible') : btnBack.classList.add('visible');
  updateNextButton();

  document.getElementById('quizPage').style.animation = 'none';
  void document.getElementById('quizPage').offsetWidth;
  document.getElementById('quizPage').style.animation = 'fadeIn 0.3s ease';
}

function selectOption(i) {
  selectedOption = i;
  answers[currentQuestion] = i;
  document.querySelectorAll('.option').forEach((opt, idx) => {
    opt.classList.toggle('selected', idx === i);
  });
  updateNextButton();
  setTimeout(() => {
    if (answers[currentQuestion] === i && currentQuestion < totalQuestions - 1) {
      nextQuestion();
    }
  }, 500);
}

function updateNextButton() {
  const btn = document.getElementById('btnNext');
  if (answers[currentQuestion] !== null) {
    btn.classList.add('active');
    btn.textContent = currentQuestion === totalQuestions - 1 ? '查看结果 →' : '下一题 →';
  } else {
    btn.classList.remove('active');
    btn.textContent = '下一题 →';
  }
}

function nextQuestion() {
  if (answers[currentQuestion] === null) return;
  if (currentQuestion < totalQuestions - 1) {
    currentQuestion++;
    renderQuestion();
  } else {
    showResult();
  }
}

function prevQuestion() {
  if (currentQuestion > 0) {
    currentQuestion--;
    renderQuestion();
  }
}

function calculateScores() {
  const scores = { content: 0, ecommerce: 0, skill: 0, aitool: 0, knowledge: 0, traffic: 0 };
  answers.forEach((ansIdx, qIdx) => {
    if (ansIdx !== null) {
      const chosen = questions[qIdx].options[ansIdx].scores;
      for (const [key, val] of Object.entries(chosen)) {
        scores[key] = (scores[key] || 0) + val;
      }
    }
  });
  return scores;
}

function showResult() {
  document.getElementById('quizPage').style.display = 'none';
  document.getElementById('resultPage').style.display = 'block';

  const scores = calculateScores();
  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  const topType = sorted[0][0];
  const result = resultTypes[topType];
  const maxScore = Math.max(...Object.values(scores), 1);

  // hero
  document.getElementById('resultEmojiWrap').textContent = result.emoji;
  document.getElementById('resultEmojiWrap').style.background = result.grad;
  document.getElementById('resultTag').textContent = result.tag;
  document.getElementById('resultTitle').textContent = result.name;
  document.getElementById('resultSubtitle').textContent = result.subtitle;

  // score grid
  const gridHtml = sorted.map(([key, val]) => {
    const pct = Math.round((val / maxScore) * 100);
    const isTop = key === topType;
    return `
      <div class="score-card${isTop ? ' top' : ''}">
        <div class="sc-emoji">${resultIcons[key]}</div>
        <div class="sc-name">${resultNames[key]}</div>
        <div class="sc-bar-bg"><div class="sc-bar" style="width:0%;background:${resultTypes[key].color}"></div></div>
        <div class="sc-pct">${pct}<span style="font-size:11px;font-weight:400;color:#86868b">%</span></div>
      </div>`;
  }).join('');
  document.getElementById('scoreGrid').innerHTML = gridHtml;

  document.getElementById('resultDetail').innerHTML = result.detail;

  // animate bars
  setTimeout(() => {
    document.querySelectorAll('.sc-bar').forEach((el, i) => {
      const key = sorted[i][0];
      const pct = Math.round((sorted[i][1] / maxScore) * 100);
      el.style.width = pct + '%';
    });
  }, 200);

  // scroll to top of result
  document.getElementById('resultPage').scrollIntoView({ behavior: 'smooth' });
}

function retryQuiz() {
  document.getElementById('resultPage').style.display = 'none';
  document.getElementById('coverPage').style.display = 'flex';
  answers = new Array(totalQuestions).fill(null);
  currentQuestion = 0;
  selectedOption = null;
}

function showShare() {
  const scores = calculateScores();
  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  const result = resultTypes[sorted[0][0]];
  document.getElementById('shareEmoji').textContent = result.emoji;
  document.getElementById('shareTitle').textContent = '🎯 ' + result.name;
  document.getElementById('shareSub').textContent = result.subtitle;
  document.getElementById('shareOverlay').classList.add('show');
}

function hideShare(e) {
  if (!e || e.target === document.getElementById('shareOverlay')) {
    document.getElementById('shareOverlay').classList.remove('show');
  }
}
