<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>你适合什么副业？</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
  }
  .container {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.06);
    overflow: hidden;
    position: relative;
    min-height: 600px;
  }

  /* ====== COVER PAGE ====== */
  .cover {
    padding: 48px 32px 40px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 560px;
  }
  .cover-emoji { font-size: 64px; margin-bottom: 20px; }
  .cover h1 {
    font-size: 26px;
    font-weight: 700;
    line-height: 1.4;
    margin-bottom: 12px;
    color: #1d1d1f;
  }
  .cover .subtitle {
    font-size: 15px;
    color: #86868b;
    line-height: 1.6;
    margin-bottom: 36px;
    max-width: 280px;
  }
  .cover .stats {
    font-size: 13px;
    color: #aeaeb2;
    margin-bottom: 24px;
  }
  .btn-start {
    background: #0071e3;
    color: #fff;
    border: none;
    padding: 14px 48px;
    border-radius: 28px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    width: 100%;
    max-width: 260px;
  }
  .btn-start:hover { background: #0077ed; transform: translateY(-1px); }
  .btn-start:active { transform: scale(0.98); }

  /* ====== QUIZ PAGE ====== */
  .quiz { padding: 32px 24px 36px; display: none; }
  .quiz-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .quiz-count {
    font-size: 13px;
    color: #86868b;
    font-weight: 500;
  }
  .progress-bar {
    width: 100%;
    height: 4px;
    background: #e8e8ed;
    border-radius: 2px;
    margin-bottom: 28px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #0071e3, #40c8ff);
    border-radius: 2px;
    transition: width 0.4s ease;
    width: 0%;
  }
  .question {
    font-size: 20px;
    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 28px;
    color: #1d1d1f;
  }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex;
    align-items: center;
    padding: 16px 18px;
    border: 2px solid #e8e8ed;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 15px;
    line-height: 1.5;
    color: #1d1d1f;
    background: #fff;
  }
  .option:hover { border-color: #0071e3; background: #f5f9ff; }
  .option.selected {
    border-color: #0071e3;
    background: #f0f6ff;
  }
  .option-letter {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    background: #f5f5f7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    margin-right: 14px;
    flex-shrink: 0;
    color: #86868b;
    transition: all 0.2s;
  }
  .option.selected .option-letter {
    background: #0071e3;
    color: #fff;
  }
  .quiz-nav {
    display: flex;
    justify-content: space-between;
    margin-top: 28px;
  }
  .btn-back {
    background: none;
    border: 2px solid #e8e8ed;
    color: #86868b;
    padding: 10px 24px;
    border-radius: 24px;
    font-size: 15px;
    cursor: pointer;
    font-weight: 500;
    visibility: hidden;
  }
  .btn-back.visible { visibility: visible; }
  .btn-next {
    background: #0071e3;
    color: #fff;
    border: none;
    padding: 12px 28px;
    border-radius: 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    opacity: 0.4;
    transition: all 0.2s;
    pointer-events: none;
  }
  .btn-next.active { opacity: 1; pointer-events: auto; }
  .btn-next:hover.active { background: #0077ed; }

  /* ====== RESULT PAGE ====== */
  .result { padding: 40px 24px 36px; display: none; text-align: center; }
  .result-emoji { font-size: 72px; margin-bottom: 16px; }
  .result-type-tag {
    display: inline-block;
    background: #f0f6ff;
    color: #0071e3;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 16px;
    border-radius: 20px;
    margin-bottom: 12px;
  }
  .result h2 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 8px;
    line-height: 1.3;
  }
  .result .result-subtitle {
    font-size: 15px;
    color: #86868b;
    margin-bottom: 24px;
    line-height: 1.5;
  }

  /* score bars */
  .score-section { text-align: left; margin-bottom: 28px; }
  .score-section h3 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 14px;
    color: #1d1d1f;
  }
  .score-item {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
    font-size: 13px;
  }
  .score-label {
    width: 80px;
    flex-shrink: 0;
    color: #1d1d1f;
    font-weight: 500;
  }
  .score-track {
    flex: 1;
    height: 8px;
    background: #e8e8ed;
    border-radius: 4px;
    overflow: hidden;
    margin: 0 10px;
  }
  .score-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.8s ease;
  }
  .score-value { width: 32px; text-align: right; color: #86868b; font-weight: 500; flex-shrink: 0; }

  /* detail */
  .result-detail {
    text-align: left;
    background: #f5f5f7;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .result-detail h3 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 10px;
    margin-top: 16px;
    color: #1d1d1f;
  }
  .result-detail h3:first-child { margin-top: 0; }
  .result-detail p {
    font-size: 14px;
    color: #515154;
    line-height: 1.7;
    margin-bottom: 8px;
  }
  .result-detail ul {
    padding-left: 18px;
    font-size: 14px;
    color: #515154;
    line-height: 1.8;
  }

  /* CTA */
  .result-cta {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
  }
  .btn-share {
    background: #0071e3;
    color: #fff;
    border: none;
    padding: 14px;
    border-radius: 28px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    transition: all 0.2s;
  }
  .btn-share:hover { background: #0077ed; }
  .btn-retry {
    background: none;
    border: 2px solid #e8e8ed;
    color: #515154;
    padding: 12px;
    border-radius: 28px;
    font-size: 15px;
    cursor: pointer;
    width: 100%;
    font-weight: 500;
    transition: all 0.2s;
  }
  .btn-retry:hover { background: #f5f5f7; }

  .disclaimer {
    font-size: 11px;
    color: #aeaeb2;
    text-align: center;
    line-height: 1.5;
  }

  /* ====== SHARE OVERLAY ====== */
  .share-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    justify-content: center;
    align-items: center;
    padding: 24px;
  }
  .share-overlay.show { display: flex; }
  .share-card {
    background: #fff;
    border-radius: 24px;
    padding: 32px 24px;
    text-align: center;
    max-width: 320px;
    width: 100%;
  }
  .share-card .close-btn {
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: #86868b;
    position: absolute;
    top: 12px;
    right: 16px;
  }
  .share-result-preview {
    background: #f5f5f7;
    border-radius: 16px;
    padding: 20px;
    margin: 16px 0;
    font-size: 18px;
    font-weight: 700;
    line-height: 1.5;
  }
  .share-tip {
    font-size: 13px;
    color: #86868b;
    margin-top: 12px;
  }

  /* animations */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-in { animation: fadeInUp 0.5s ease forwards; }
</style>
</head>
<body>
<div class="container" id="app">

  <!-- COVER -->
  <div class="cover" id="coverPage">
    <div class="cover-emoji">💼</div>
    <h1>你适合<br>什么副业？</h1>

      <button class="btn-back" id="btnBack" onclick="prevQuestion()">上一题</button>
      <button class="btn-next" id="btnNext" onclick="nextQuestion()">下一题</button>
    </div>
  </div>

  <!-- RESULT -->
  <div class="result" id="resultPage">
    <div class="result-emoji" id="resultEmoji"></div>
    <div class="result-type-tag" id="resultTag"></div>
    <h2 id="resultTitle"></h2>
    <p class="result-subtitle" id="resultSubtitle"></p>

    <div class="score-section">
      <h3>📊 你的副业基因图谱</h3>
      <div id="scoreBars"></div>
    </div>

    <div class="result-detail" id="resultDetail"></div>

    <div class="result-cta">
      <button class="btn-share" onclick="showShare()">📤 分享我的结果</button>
      <button class="btn-retry" onclick="retryQuiz()">🔄 重新测试</button>
    </div>
    <p class="disclaimer">* 本测试仅供娱乐参考，不作为职业建议</p>
  </div>

  <!-- SHARE OVERLAY -->
  <div class="share-overlay" id="shareOverlay" onclick="hideShare(event)">
    <div class="share-card" onclick="event.stopPropagation()" style="position:relative">
      <button class="close-btn" onclick="hideShare()" style="position:absolute;top:8px;right:12px">&times;</button>
      <p style="font-size:14px;color:#86868b">我的副业基因是——</p>
      <div class="share-result-preview" id="shareResultText"></div>
      <p style="font-size:13px;color:#515154">你也来测测？👉</p>
      <p style="font-size:11px;color:#aeaeb2;margin-top:8px">长按截图分享给朋友</p>
    </div>
  </div>
</div>

// ===== STATE =====
let currentQuestion = 0;
let answers = [];
let selectedOption = null;
const totalQuestions = questions.length;

// ===== FUNCTIONS =====
function startQuiz() {
  document.getElementById('coverPage').style.display = 'none';
  document.getElementById('quizPage').style.display = 'block';
  document.getElementById('resultPage').style.display = 'none';
  currentQuestion = 0;
  answers = new Array(totalQuestions).fill(null);
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQuestion];
  document.getElementById('quizCount').textContent = `${currentQuestion + 1}/${totalQuestions}`;
  document.getElementById('progressFill').style.width = `${((currentQuestion + 1) / totalQuestions) * 100}%`;
  document.getElementById('questionText').textContent = q.q;

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];

  selectedOption = answers[currentQuestion];

  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option' + (selectedOption === i ? ' selected' : '');
    div.innerHTML = `<span class="option-letter">${letters[i]}</span>${opt.text}`;
    div.onclick = () => selectOption(i);
    container.appendChild(div);
  });

  // back button
  const btnBack = document.getElementById('btnBack');
  if (currentQuestion === 0) {
    btnBack.classList.remove('visible');
  } else {
    btnBack.classList.add('visible');
  }

  // next button
  updateNextButton();

  // animate
  document.getElementById('quizPage').classList.remove('fade-in');
  void document.getElementById('quizPage').offsetWidth;
  document.getElementById('quizPage').classList.add('fade-in');
}

function selectOption(i) {
  selectedOption = i;
  answers[currentQuestion] = i;
  const options = document.querySelectorAll('.option');
  options.forEach((opt, idx) => {
    opt.classList.toggle('selected', idx === i);
  });
  updateNextButton();

  // auto-advance after short delay
  setTimeout(() => {
    if (answers[currentQuestion] === i && currentQuestion < totalQuestions - 1) {
      nextQuestion();
    }
  }, 400);
}

function updateNextButton() {
  const btn = document.getElementById('btnNext');
  if (answers[currentQuestion] !== null) {
    btn.classList.add('active');
    btn.textContent = currentQuestion === totalQuestions - 1 ? '查看结果' : '下一题';
  } else {
    btn.classList.remove('active');
    btn.textContent = '下一题';
  }
}

function nextQuestion() {
  if (answers[currentQuestion] === null) return;
  if (currentQuestion < totalQuestions - 1) {
    currentQuestion++;
    renderQuestion();
  } else {
    showResult();
  }
}

function prevQuestion() {
  if (currentQuestion > 0) {
    currentQuestion--;
    renderQuestion();
  }
}

function calculateScores() {
  const scores = { content: 0, ecommerce: 0, skill: 0, aitool: 0, knowledge: 0, traffic: 0 };
  answers.forEach((ansIdx, qIdx) => {
    if (ansIdx !== null) {
      const chosen = questions[qIdx].options[ansIdx].scores;
      for (const [key, val] of Object.entries(chosen)) {
        scores[key] = (scores[key] || 0) + val;
      }
    }
  });
  return scores;
}

function showResult() {
  document.getElementById('quizPage').style.display = 'none';
  document.getElementById('resultPage').style.display = 'block';

  const scores = calculateScores();
  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  const topType = sorted[0][0];
  const result = resultTypes[topType];

  document.getElementById('resultEmoji').textContent = result.emoji;
  document.getElementById('resultTag').textContent = result.tag;
  document.getElementById('resultTitle').textContent = result.name;
  document.getElementById('resultSubtitle').textContent = result.subtitle;

  // score bars
  const maxScore = Math.max(...Object.values(scores), 1);
  const colors = {
    content: '#FF6B6B', ecommerce: '#FFA726', skill: '#66BB6A',
    aitool: '#7C4DFF', knowledge: '#42A5F5', traffic: '#EF5350'
  };
  const names = {
    content: '内容创作', ecommerce: '电商卖货', skill: '技能服务',
    aitool: 'AI工具', knowledge: '知识付费', traffic: '流量操盘'
  };
  const barsHtml = sorted.map(([key, val]) => {
    const pct = Math.round((val / maxScore) * 100);
    return `
      <div class="score-item">
        <span class="score-label">${names[key]}</span>
        <div class="score-track"><div class="score-fill" style="width:${pct}%;background:${colors[key]}"></div></div>
        <span class="score-value">${pct}%</span>
      </div>`;
  }).join('');
  document.getElementById('scoreBars').innerHTML = barsHtml;

  document.getElementById('resultDetail').innerHTML = result.detail;

  // animate bars
  setTimeout(() => {
    document.querySelectorAll('.score-fill').forEach(el => {
      el.style.width = el.style.width;
    });
  }, 100);

  document.getElementById('resultPage').classList.remove('fade-in');
  void document.getElementById('resultPage').offsetWidth;
  document.getElementById('resultPage').classList.add('fade-in');
}

function retryQuiz() {
  document.getElementById('resultPage').style.display = 'none';
  document.getElementById('coverPage').style.display = 'flex';
  document.getElementById('coverPage').classList.remove('fade-in');
  void document.getElementById('coverPage').offsetWidth;
  document.getElementById('coverPage').classList.add('fade-in');
  answers = new Array(totalQuestions).fill(null);
  currentQuestion = 0;
}

function showShare() {
  const scores = calculateScores();
  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  const result = resultTypes[sorted[0][0]];
  document.getElementById('shareResultText').innerHTML = `${result.emoji} ${result.name}<br><span style="font-size:14px;font-weight:400;color:#86868b">${result.subtitle}</span>`;
  document.getElementById('shareOverlay').classList.add('show');
}

function hideShare(e) {
  if (!e || e.target === document.getElementById('shareOverlay')) {
    document.getElementById('shareOverlay').classList.remove('show');
  }
}
</script>
