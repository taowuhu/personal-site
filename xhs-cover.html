<html lang="zh-CN">
<head>

<title>小红书封面生成器 · 大厂设计语言</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','Noto Sans SC',-apple-system,sans-serif;background:#0a0a0f;color:#eaeaef;min-height:100vh}
.c{max-width:900px;margin:0 auto;padding:30px 20px}
h1{font-size:24px;text-align:center;background:linear-gradient(135deg,#0071e3,#a259ff,#ff385c);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{text-align:center;color:#555;font-size:13px;margin:6px 0 28px}
.card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);border-radius:14px;padding:20px;margin-bottom:16px}
label{display:block;font-size:12px;color:#777;margin-bottom:5px;font-weight:600}
input[type=text]{width:100%;padding:12px 14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;color:#fff;font-size:14px;outline:none;margin-bottom:10px}
input:focus{border-color:rgba(0,113,227,.3)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.fcard{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);border-radius:10px;padding:12px}
.fcard input{margin-bottom:6px;font-size:12px;padding:8px 10px}
.brand-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:640px){.brand-grid{grid-template-columns:repeat(3,1fr)}.row,.row3{grid-template-columns:1fr}}
.brand-btn{padding:10px 6px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:8px;color:#888;font-size:11px;cursor:pointer;text-align:center}
.brand-btn:hover{border-color:rgba(255,255,255,.1);color:#ccc}
.brand-btn.on{border-color:#0071e3;background:rgba(0,113,227,.08);color:#0071e3;font-weight:700}
.gen{width:100%;padding:15px;background:linear-gradient(135deg,#0071e3,#a259ff);color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer}
.gen:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,113,227,.15)}
.gen:disabled{opacity:.3;transform:none}
.result{margin-top:20px;text-align:center}
.result img{max-width:340px;border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.3)}
.dl-btn{display:inline-block;margin-top:14px;padding:10px 28px;background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.2);border-radius:8px;color:#34d399;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer}
.loading{display:none;text-align:center;padding:30px;color:#666}.loading.show{display:block}
.spin{width:36px;height:36px;border:3px solid rgba(255,255,255,.08);border-top-color:#0071e3;border-radius:50%;animation:s .7s linear infinite;margin:0 auto 14px}
@keyframes s{to{transform:rotate(360deg)}}
.ft{text-align:center;padding:30px;color:#333;font-size:11px}.ft a{color:#555}
details{margin-top:8px}summary{font-size:11px;color:#666;cursor:pointer}
</style>
</head>

<div class="c">
<h1>🎨 小红书封面生成器</h1>
<p class="sub">大厂设计语言系列 · 拆解品牌设计DNA做封面</p>

<div class="card">
<label>📝 封面大标题</label>
<input type="text" id="headline" value="用 Apple 的设计语言做封面" maxlength="40">
<div class="row">
<div><label>系列标签</label><input type="text" id="series" value="大厂设计语言 · Vol.01" maxlength="20"></div>
<div><label>副标题</label><input type="text" id="subhead" value="拆解苹果官网设计规范，直接套用到你的小红书图文" maxlength="60"></div>
</div>
<div class="row">
<div><label>作者名</label><input type="text" id="author" value="废废" maxlength="10"></div>
<div><label>作者简介</label><input type="text" id="authorDesc" value="设计师 · AI工具创作者" maxlength="20"></div>
</div>
</div>

<div class="card">
<label>🎯 三个亮点卡片</label>
<div class="row3">
<div class="fcard"><input type="text" id="f1icon" value="🎨" maxlength="4" placeholder="图标"><input type="text" id="f1title" value="极致黑白" maxlength="8"><input type="text" id="f1desc" value="#000 与 #f5f5f7 交替的电影感节奏" maxlength="30"></div>
<div class="fcard"><input type="text" id="f2icon" value="✦" maxlength="4"><input type="text" id="f2title" value="唯一蓝色" maxlength="8"><input type="text" id="f2desc" value="#0071e3 全站仅一个强调色" maxlength="30"></div>
<div class="fcard"><input type="text" id="f3icon" value="Aa" maxlength="4"><input type="text" id="f3title" value="SF Pro" maxlength="8"><input type="text" id="f3desc" value="负字距 · 1.07行高 标题紧凑如机械切割" maxlength="30"></div>
</div>
</div>

<div class="card">
<label>🎨 品牌风格</label>
<div class="brand-grid" id="brandGrid"></div>
</div>

<button class="gen" id="genBtn" onclick="generate()">✨ 生成封面</button>
<div class="loading" id="loading"><div class="spin"></div><p>渲染中...</p></div>
<div class="result" id="result"></div>
</div>
<div class="ft">MIT · <a href="https://github.com/taowuhu/xhs-cover-gen">GitHub</a> · 纯前端 · html2canvas</div>
<div id="renderArea" style="position:fixed;left:-9999px;top:0;z-index:-1"></div>

function renderBrands(){
  document.getElementById('brandGrid').innerHTML=BRANDS.map((b,i)=>`<button class="brand-btn${i?'':' on'}" data-k="${b.k}">${b.n}</button>`).join('');
  document.querySelectorAll('.brand-btn').forEach(btn=>btn.onclick=()=>{
    document.querySelectorAll('.brand-btn').forEach(q=>q.classList.remove('on'));
    btn.classList.add('on');brand=BRANDS.find(b=>b.k===btn.dataset.k);
    applyBrandDefaults();
  });
}

.bottom-strip{height:72px;padding:0 80px;display:flex;align-items:center;justify-content:center;gap:14px;border-top:1px solid ${b.dividerColor};flex-shrink:0}

</style></head><body><div class="frame">
<div class="top-bar"><span class="series-tag">${s}</span><div class="author-info"><div class="author-avatar">${ai}</div><div class="author-text"><span class="author-name">${a}</span><span class="author-desc">${ad}</span></div></div></div>
<div class="hero"><div class="overline">DESIGN SYSTEM BREAKDOWN</div><h1 class="headline">${hl}</h1><p class="subheadline">${sh}</p><div class="cta-row"><button class="cta-primary">获取模板 →</button><button class="cta-secondary">了解更多</button></div></div>

<div class="bottom-strip">${tagsHTML}</div>
</div></body></html>`;
}

async function generate(){
  const h=document.getElementById('headline').value.trim();if(!h)return alert('输入标题');
  const btn=document.getElementById('genBtn'),l=document.getElementById('loading'),r=document.getElementById('result'),ra=document.getElementById('renderArea');
  btn.disabled=true;l.classList.add('show');r.innerHTML='';
  ra.innerHTML=buildHTML(brand);
  try{
    const c=await html2canvas(ra.firstElementChild,{width:1500,height:2000,scale:1,useCORS:true,allowTaint:true,backgroundColor:null});
    const u=c.toDataURL('image/png');
    l.classList.remove('show');
    r.innerHTML=`<img src="${u}" style="max-width:340px"><br><a class="dl-btn" href="${u}" download="xhs-${brand.k}.png">⬇ 下载封面 (1500×2000)</a>`;
  }catch(e){l.classList.remove('show');r.innerHTML=`<p style="color:#ef4444">失败: ${e.message}</p>`}
  ra.innerHTML='';btn.disabled=false;
}
renderBrands();
</script>
